  const proseText = [
    "Long time ago in Venice there was a rich Senator who was known as Brabantio. He had a beautiful daughter, the gentle Desdemona. She was sought by various suitors, both of her clime and complexion, but she found none of her choice. The noble lady, who regarded the heart more than the appearance and complexion of man, had chosen the person of her affections-a Moor, a dark complexioned nobleman, whom her father loved deeply and often invited him to their mansion. The noble Moor, Othello, was a valiant soldier and by his heroics in bloody wars against the Turks, he had been raised to the rank of the General and was highly esteemed and revered thoroughout the state.",
    "Othello had been a great traveller and Desdemona was all the more keen to listen to the stories of adventure that Othello recollected from his experiences in the battles, sieges and encounters, the perils he had been exposed to, his hair-breadth escapes when he entered a breach, or marched up to the mouth of a cannon and how he had been captivated by the insolent enemy and sold as a slave, how he demeaned himself in that state, and escaped.",
    "Desdemona listened with rapt attention of all these accounts, added to the narration of the strange things Othello had seen in foreign countries: the vast wilderness and romantic caverns, the quarries, the rocks and lofty mountains that touched the clouds, the savage nations, the cannibals who are man-eaters, and a race of people in Africa whose heads do grow beneath their shoulders. These stories enticed Desdemona so much that even if she was called for any household affairs, she would finish off the work with all haste and return to Othello with greedy ear to devour his discourse. At the end of his stories Desdemona would always sigh and then thank him and wished that if he had a friend who loved her, he had only to teach him, how to tell his story, and that would woo her. Upon this hint, delivered not with more frankness than modesty, and blushes, which Othello could not but understand and he spoke more openly of his love and thus gained the consent of the generous and gorgeous lady Desdemona to marry him.",
    "Their marriage, which though was privately solemnized, could not be kept a secret for long. When the news reached Brabantio, he appealed to the Duke of Venice and prayed for justice against Othello accusing him of casting spell and witchcraft to seduce the gentle Desdemona, winning her heart and marrying her without taking the consent of her father.",
    "Meanwhile, the state of Venice was in urgent need of Othello. The Senate received a news that the Turks had set sail a fleet with mighty preparation for hostility and they were moving towards Cyprus. In this emergency, Othello was deemed as the most competent General to defend Cyprus against the invasion of the Turks. Hence, Othello was summoned before the Senate. He was therefore called to the Senate both as a candidate for a noble employment and esteem as well as a culprit, charged with offences by Senator Brabantio.",
    "The old Senator was heard with utmost patience in the assembly of the Senators and the infuriated father accused Othello in outrageous manner. Hence, when Othello was called upon for his defence, he had only to narrate a simple story of his love, which he did so in such artless eloquence that even the Duke had to confess that a tale so told would have won his daughter too. And the spells and conjurations which Othello had used in his courtship plainly appeared to have been no more than the honest arts of wooing and the only witchcraft which he had used is the skill of telling a soft tale to win a lady's heart.",
    "The statement of Othello was confirmed by Desdemona who appeared in court and acknowledged that she was bound by duty to Brabantio for her life and education. But now she has a higher duty to perform for her lover and husband Othello, quite like her mother had done years ago in preferring Brabantio above her father. Unable to maintain his plea, Brabantio accepted the Moor as his son-in-law and told him that with all his heart he would keep her away from him. He was also glad that he had no other child, for this behaviour of Desdemona would have made him a tyrant and hang clogs on them for desertion. He even warned Othello about Desdemona who had deceived her father and might also deceive him.",
    "After the trial, Othello readily went to the war in Cyprus along with Desdemona as she refused to stay with her father any more. She boldly declared, \"I loved the Moor to live with him\". So the newly married couple set sail for Cyprus. But, as soon they landed in Cyprus, the news arrived that a violent tempest had dispersed the Turkish fleet and the island was, thus, secure. But the war, which Othello was to suffer, was now beginning and the enemies, which malice stirred up against Desdemona, proved in their nature more deadly than strangers or infidels.",
    "Among the friends of Othello, no one possessed his confidence more than Cassio. He was a young Florentine soldier, amorous, and of pleasing nature which attracted the women. He was handsome and eloquent. Any married man of advanced years having a young, beautiful wife would be much alarmed of such a person except Othello who was free from jealousy, as he was noble and incapable of suspecting him to be had used Cassio in his love affair with Desdemona for Othello feared that he lacked the amorous qualities of Cassio that would please ladies, and so would often depute Cassio to court for him; such innocent simplicity being rather an honour than a blemish to the character of the valiant Moor. It was therefore no wonder if, next to Othello, the gentle Desdemona loved and trusted Cassio. Hence, the marriage of this couple made little difference to their relationship with Cassio. He frequented their house, and his free and rattling talk was endearing to Othello for he himself was of a serious temper.",
    "Othello had of late promoted Cassio to the rank of Lieutenant, a place of trust and nearest to the General. The promotion gave great offence to Iago, an elder nobleman, who thought he had a better claim than Cassio and would often scorn at Cassio to be a person befitting for the company of ladies, and knew little of the art of warfare. Iago hated Cassio. He also hated Othello for favouring Cassio and also for an unjust suspicion that the Moor was too fond of Emilia, Iago's wife. From these imaginary provocations, Iago conceived a scheme of revenge that would involve Cassio, Othello and Desdemona in one common ruin.",
    "Iago was crafty. He studied human mind deeply. He knew that of all the kinds of afflictions that torment man, the pains of jealousy were the most unbearable and had the sorest sting. He thought if he could succeed in making Othello envious of Cassio, then it would be an excellent plot of revenge which might culminate in the death of Cassio or Othello or both, he cared not.",
    "The arrival of the General and his lady in Cyprus, and receiving the news of the dispersion of enemy's fleet, created a sort of holiday mood in the island. Everybody was involved in feasting and merry making. Cassio had the direction of the guard that night with a charge from Othello to restrain the soldiers from drinking excessively. On that night Iago began his deep-laid plans of mischief. Under the guise of loyalty and love to the General, he lured Cassio to have a drink, which was a great fault for an officer on guard. Although Cassio resisted initially, yet he soon fell into the guile of Iago. He swallowed wine glass after glass and became drunk. Provoked by Iago, he praised the gentle lady Desdemona. He even told Iago, \"She is a most exquisite lady.\" At the end he got involved in a scuffle. Montano, a worthy officer, who interfered to pacify the dispute, was wounded in the scuffle. Taking advantage of the situation Iago spread the alarm causing the castle-bell to be rung as if a dangerous mutiny had set in. The bell awakened Othello who dressed in haste came down to the scene of action and asked Cassio of the cause. By now, Cassio had regained some rationality, but was too ashamed to reply. Iago pretended to be reluctant to tell the truth, and, as if compelled by Othello, gave an account of the whole matter in such a manner that it seemed to make Cassio's offence less, but actually made it appear greater than it was.",
    "Consequently, Othello who was a strict observer of discipline was forced to take away the rank of lieutenant from Cassio. Thus, lago's first artifice succeeded. He had now undermined his hated adversary Cassio and was successful to thrust him out of his place.",
    "Cassio, whom this misfortune had entirely sobered, now lamented to his seeming friend Iago: \"Reputation, reputation, reputation! O, I have lost my reputation! I have lost the immortal part of myself, and what remains is bestial. My reputation, lago, my reputation!\" He despised himself. He thought how he could ask the General for his place again. Iago advised him to apply to the lady to mediate for him with her lord.",
    "Cassio did as lago advised him. Desdemona promised him that she would be his solicitor with her lord. She immediately set about for this cause in so earnest and pretty a manner that Othello, who was mortally offended with Cassio, could not put her off. When he pleaded delay because it was too soon to pardon such an offender, she insisted that it should be the next night, or the next morning to that at farthest. Then she showed how penitent and humbled poor Cassio was and that his offence did not deserve punishment of such magnitude. But Othello still hung back. So she said, \"What! my lord, that I should have so much to do to plead for Cassio, Michael Cassio, that came a-courting for you, and oftentimes, when I have spoken in dispraise of you, has taken your part! I count this but a little thing to ask of you. When I mean to try your love indeed, I shall ask a weighty matter.\" Othello could deny nothing to such a pleader. He promised to receive Michael Cassio again in his favour, but only requested Desdemona to leave the time to him.",
    "It happened that Othello and Iago had entered into the room where Desdemona was already present with Cassio who had been imploring her intercession. He departed through the opposite door as Othello entered and Iago, who was full of art, said in a low voice, as if to himself, \"I like not that.\" Othello took no great notice of what he said. The interaction which immediately took place with Desdemona put it out of his head. But he recalled it later. When Desdemona departed from the scene Iago asked Othello, as if mere satisfaction of his thought, whether Cassio knew of the General's courtship with Desdemona. The General replied in affirmative and added that he had gone between them very often during the courtship. lago raised his brow, as if he had got fresh light on some terrible matter, and remarked, \"Indeed!\". This brought into Othello's mind the words of lago which he said while entering the room. Thus he began to think there was some meaning in that private meeting of Desdemona with Cassio. Othello deemed lago to be a just man, full of love and honesty. So he urged Iago to speak out of what he knew. \"And what,\" said lago, \"if some thoughts very vile should have intruded into my breast?\" he went on to say that it would be a pity if any trouble would arise to Othello out of his imperfect observations. So it would not be wise for Othello's peace to know his thoughts. By then Othello's curiosity was raised almost to distraction and lago, as if in earnest care for Othello's peace of mind, sought him to be cautious of jealousy. By the very caution he pretended to give him against suspicion. \"I know,\" said Othello, \"that my wife is fair, loves company and feasting, is free of speech, sings, plays, and dances well: but where virtue is, these qualities are virtuous. I must have proof before I think her dishonest.\" Then Iago, as if glad that Othello was slow to believe ill of his lady, frankly declared that he had no proof. He begged Othello to observe her behaviour well particularly when Cassio was near by. He should not be jealous or too secure. Iago knew the dispositions of the Italian ladies better than Othello. He knew that in Venice the wives would let the world see their pranks but they dared not show their husbands. Iago craftily insinuated that Desdemona deceived her father in marrying with Othello, and carried it so closely, that old Brabantio thought that witchcraft had been used. Othello was much moved by this argument. He wondered if she could deceive her father, she might deceive her husband as well.",
    "Iago begged apology for having moved him. But Othello urged him to go on. Iago pretended that he was reluctant to produce anything against Cassio whom he called his friend. However, he reminded Othello how Desdemona had rejected many suitable matches of her own clime and complexion and had married him, which showed unnatural in her, and proved her to have a strong will. So when better judgment returned, how probable it was that she would fall upon comparing Othello with the white complexioned young Italians of her countrymen. He, therefore, advised Othello to put off his reconcilement with Cassio a little longer. Meanwhile Othello should note with what earnestness Desdemona would solicit for Cassio. So mischievously the treacherous villain laid his plots to turn the gentle qualities of the innocent lady into her destruction, and make a net for her out of her own goodness to entrap her: first setting Cassio on to entreat her mediation, and then out of that very mediation contriving stratagems for her ruin.",
    "Othello's long conversation with lago led him to restlessness. Neither poppy, nor the juice of mandragora, nor all the sleeping potions of the world, could once again restore to him that sweet rest which he had enjoyed only yesterday. His occupation sickened upon him. He no longer took delight in arms. His heart, that used to be roused at the sight of troops, would no longer stir at the sound of drums or the neighing of war-horses. He seemed to have lost all that pride and ambition which are the virtues of a soldier. Sometimes he thought his wife to be honest. Again he wondered that she was not. At times he thought lago to be just, but at times he thought the contrary. Thus, he was torn to pieces with these distracting thoughts. Once he laid hold on lago's throat, and demanded proof of Desdemona's guilt or threatened instant death for his having belied her. Iago feigned indignation that his honesty was misinterpreted to be a vice. He pointed out if Othello had not sometimes seen a handkerchief spotted with strawberries in the hand of Desdemona, and Othello acknowledged that it was his first gift to Desdemona. \"That same handkerchief \" said lago, \"did I see Michael Cassio this day wipe his face with.\" Othello replied, \"If it be as you say, I will not rest till a wide revenge swallow them up: first, for a token of your fidelity, I expect that Cassio shall be put to death within three days; and for that fair devil, I will withdraw and devise some swift means of death for her.\"",
    "Othello did not care to enquire how Cassio came by with the handkerchief of Desdemona. He passed death sentence upon both of them. Desdemona had never given such a present to Cassio; nor would this constant lady have ever wronged her husband with doing so naughty a thing as to give her lord's presents to another man. The shrewd Iago used his wife, Emilia, to steal the handkerchief from Desdemona, under pretence of getting the work copied, but in reality to drop it in Cassio's way, where he might find it, and give a handle to lago's suggestion that it was Desdemona's present.",
    "Soon after the meeting his wife, Othellorypted that he had a headache, and desired her to lend him her handkerchief to hold on to his temples. Desdemona did so, but Othello wanted the handkerchief which he gave her. Desdemona could not find it. \"That's a fault,\" said Othello. \"That handkerchief was given to my mother by an Egyptian woman. She was a charmer and could almost read the thoughts of people; she told her, while she kept it, it would make her amiable, and subdue my father entirely to her love; but, if she lost it, or made a gift of it, my father would loathe her as much as he had loved her.\" The lady said, \"Is it possible?\" Othello replied, \"It is true. It is a magical handkerchief.\" Desdemona was ready to die with fear, for she plainly perceived that she had lost it, and with it, she feared, the love of her husband. She tried to divert him from too serious thoughts. She cheerfully told him that all his talk about the handkerchief was only to put her off from Cassio's suit and went on to praise him until Othello in perfect distraction burst out of the room. Then Desdemona began to suspect that her lord was jealous of Cassio.",
    "When Othello and Desdemona met again, he accused her more plainly of being unfaithful, and of loving another man. Othello wept and told her that he could have borne all sorts of evils with fortitude-poverty, disease and disgrace, but her infidelity had broken his heart. He called her a weed that looked so fair and smelled so sweet that the sense ached at it. He wished she had never been born. When Othello left her, Desdemona was so stupefied with wonder at her husband's untrue suspicion of her, that a weightlike sleep came over her. She only desired that her attendant to make her bed, and to lay her wedding-sheets upon it. She said that when people teach their babies, they do it by gentle means and easy tasks, and Othello might have chided her so; for in good faith she was but a child when she was children.",
    "Desdemona soon fell asleep. Othello entered the room full of dark purpose which he had meditated of putting her lady to death. When he saw her asleep he thought he would not shed her blood, but he was resolved that should die else she would live to betray more as she had done him. Then he kissed her for the last time and he wept but he said they were cruel tears.",
    "Desdemona was awakened with his kisses. She looked upon Othello, and she saw him gnaw his lips and roll his eyes. She knew he was always fatal when he looked so. He told her to prepare for death and to say her prayers for he would not kill her soul. Desdemona begged for mercy, and to know her fault. Then he named Cassio and the handkerchief which, he said, she had given him, and as the guiltless lady was proceeding to clear herself, he suddenly would hear no more, but covering her up in the bed clothes, stifled her till she died.",
    "At the same time Cassio came in, wounded and bleeding. Iago had set one of his men to assassinate him but the fellow was unable to kill Cassio. He was killed by Iago to prevent discovery. In his pockets were found certain letters which exposed the guilt of Iago and confirmed the innocence of Cassio who now came to Othello to beg apology and also to ask him the reason why Iago had been employed to murder him.",
    "The discovery was like a thunderstroke to Othello who now felt he was no better than a murder, and that his lady was innocent and faithful. Extreme anguish made life intolerable and killed himself falling upon his sword and throwing himself upon the lifeless body of his dear wife.",
    "These rash acts raised much passion of horror and amazement among the by standers. Othello had borne a fair reputation, and until he was wrought upon by the arts of a villain, he was indeed a loving and doting husband. He had loved Desdemona not wisely, but too well. When he was dead all his former merits and valiant acts were remembered. Iago was executed with strict tortures, and the state of Venice lamented for the demise of their renowned General Othello."

    "অনেকদিন আগে ভেনিসে ব্র্যাবানসিও নামে এক ধনী সেনেটর ছিলেন। তাঁর দেশিমোনা নামে এক সুন্দর কন্যা ছিল। বহু পাত্র তাঁর পাণিপ্রার্থী হলেও তিনি কাউকে পছন্দ করেননি। মনুষ্যের বাহ্যিক রূপের চেয়ে হৃদয়কে যিনি বেশি মূল্য দিতেন, সেই মহীয়সী নারী এমন একজনকে ভালোবেসেছিলেন—একজন মুর (শ্বেতাঙ্গ নন, শ্যামাঙ্গ nobleman), যাঁর বাবা তাঁকে অত্যন্ত ভালোবাসতেন এবং প্রায়ই তাঁদের প্রাসাদে আমন্ত্রণ জানাতেন। বীর মুর ওথেলো এক সাহসী সৈনিক ছিলেন এবং তুর্কিদের বিরুদ্ধে রক্তক্ষয়ী যুদ্ধে তাঁর বীরত্বের জন্য তাঁকে জেনারেল পদে উন্নীত করা হয়েছিল এবং সমগ্র রাজ্যে তিনি অত্যন্ত সম্মানিত ও পূজিত ছিলেন।",
    "ওথেলো একজন মহান ভ্রমণকারী ছিলেন এবং দেশিমোনা যুদ্ধ, অবরোধ, অভিযান, তাঁর জীবনের চরম বিপদসমূহ, দুর্গ ভেদ করার সময় মৃত্যুর মুখ থেকে ফিরে আসা কিংবা কামানের মুখের সামনে দাঁড়ানোর রোমাঞ্চকর ঘটনা এবং কীভাবে তিনি উদ্ধত শত্রুর হাতে বন্দী হয়ে দাস হিসেবে বিক্রী হয়েছিলেন ও পরে পালিয়েছিলেন—সেই সমস্ত অভিজ্ঞতার গল্প শুনতে দারুণ আগ্রহী ছিলেন।",
    "দেশিমোনা এই সমস্ত গল্প একধ্যানে ও মন্ত্রমুগ্ধ হয়ে শুনতেন; এর সাথে যুক্ত হয়েছিল ওথেলোর দেখা বিদেশি ভূখণ্ডের নানা অদ্ভুত বিষয়: বিশাল অরণ্য ও মনোরম গুহা, কোয়ারি, পাথর ও মেঘ ছুঁয়ে যাওয়া উঁচু পাহাড়, বর্বর জাতি, মানুষখেকো নরখাদক এবং আফ্রিকার এক জাতি যাদের মাথা কাঁধের নিচে জন্মায়। এই গল্পগুলো দেশিমোনাকে এমনভাবে প্রলুব্ধ করেছিল যে ঘরের কাজের ডাক পড়লেও তিনি দ্রুত কাজ শেষ করে ওথেলোর দীর্ঘ বক্তব্য ব্যাকুল কান দিয়ে শুনতে চলে আসতেন। গল্পের শেষে দেশিমোনা দীর্ঘশ্বাস ফেলে তাঁকে ধন্যবাদ জানাতেন এবং কামনা করতেন যে ওথেলোর এমন কোনো বন্ধু যদি তাঁকে ভালোবাসত, তবে সে যেন তাঁকে গল্প বলার কৌশল শিখিয়ে দিত, যা তাঁকে জয় করতে পারত। এই ইঙ্গিতে ওথেলো তাঁর ভালোবাসার কথা আরও খোলামেলাভাবে প্রকাশ করেন এবং উদার ও সুন্দর নারী দেশিমোনাকে বিয়ে করার সম্মতি লাভ করেন।",
    "তাঁদের এই বিয়ে গোপনে সম্পন্ন হলেও বেশিদিন তা গোপন রাখা যায়নি। যখন এই খবর ব্র্যাবানসিওর কাছে পৌঁছাল, তিনি ভেনিসের ডিউকের কাছে আবেদন করলেন এবং ওথেলোর বিরুদ্ধে জাদুটোনা করে কোমল দেশিমোনাকে প্রলুব্ধ করা ও বাবার সম্মতি ছাড়াই তাঁকে বিয়ে করার অভিযোগ এনে ন্যায়বিচার প্রার্থনা করলেন।",
    "এদিকে ভেনিস রাষ্ট্রের ওথেলোকে অতি জরুরিভাবে প্রয়োজন ছিল। সেনেট খবর পেল যে তুর্কিরা বিশাল প্রস্তুতি নিয়ে সাইপ্রাসের দিকে বহর নিয়ে রওনা হয়েছে। এই জরুরি পরিস্থিতিতে ওথেলোকে তুর্কিদের আক্রমণ থেকে সাইপ্রাস রক্ষা করার জন্য সবচেয়ে উপযুক্ত জেনারেল হিসেবে বিবেচনা করা হলো। তাই সেনেট ওথেলোকে তলব করল। তাঁকে একই সাথে একজন সম্মানিত প্রার্থী ও সেনেটর ব্র্যাবানসিওর আনীত অপরাধের অভিযুক্ত হিসেবে সেনেটে ডাকা হয়েছিল।",
    "বৃদ্ধ সেনেটরের কথা সেনেটরদের সভায় অত্যন্ত ধৈর্যের সাথে শোনা হলো এবং ক্ষিপ্ত পিতা অত্যন্ত আপত্তিকরভাবে ওথেলোর বিরুদ্ধে অভিযোগ আনলেন। এরপর ওথেলোকে আত্মপক্ষ সমর্থনের জন্য ডাকা হলে তিনি তাঁর প্রেমের এক সহজ-সরল গল্প শোনালেন, যা এত সাবলীল ও বাকপটুতার সাথে তিনি বললেন যে ডিউক পর্যন্ত স্বীকার করতে বাধ্য হলেন যে এমন গল্প বললে তাঁর মেয়েকেও জয় করা যেত। ওথেলো তাঁর প্রেমালাপে যে জাদুটোনা ব্যবহার করেছিলেন তা আদতে প্রণয়ের সৎ উপায় বৈ আর কিছু ছিল না।",
    "ওথেলোর বক্তব্য দেশিমোনা আদালতে উপস্থিত হয়ে সমর্থন করলেন এবং স্বীকার করলেন যে জীবন ও শিক্ষার জন্য তিনি ব্র্যাবানসিওর কাছে ঋণী হলেও তাঁর স্বামী ও প্রেমিক ওথেলোর প্রতি তাঁর উচ্চতর কর্তব্য রয়েছে। অভিযোগ প্রমাণ করতে না পেরে ব্র্যাবানসিও মুরকে তাঁর জামাই হিসেবে গ্রহণ করলেন এবং মুরকে সতর্ক করে বললেন দেশিমোনা যেমন তাঁর বাবাকে ফাঁকি দিয়েছে, তেমনি ওথেলোকেও ফাঁকি দিতে পারে।",
    "বিচার শেষ হওয়ার পর ওথেলো দেশিমোনাকে সঙ্গে নিয়ে সাইপ্রাসের যুদ্ধের উদ্দেশ্যে রওনা হলেন। সাইপ্রাসে পৌঁছানোর সাথে সাথেই খবর এল যে এক প্রচণ্ড সামুদ্রিক ঝড়ে তুর্কি নৌবহর ছত্রভঙ্গ হয়ে গেছে এবং দ্বীপটি সুরক্ষিত রয়েছে। কিন্তু ওথেলোর আসল যুদ্ধ তখন শুরু হতে চলেছিল, কারণ দেশিমোনাকে ঘিরে যে বিদ্বেষী শত্রুরা জেগে উঠেছিল তারা বহিরাগত শত্রুদের চেয়েও বেশি মারাত্মক প্রমাণিত হলো।",
    "ওথেলোর বন্ধুদের মধ্যে ক্যাসিও তাঁর সবচেয়ে বিশ্বস্ত ছিলেন। তিনি ছিলেন এক তরুণ ফ্লরেন্সীয় সৈনিক, আকর্ষণীয় ও প্রণয়প্রবণ। ওথেলো কোনো রকম ঈর্ষা ছাড়াই ক্যাসিওকে দেশিমোনার সঙ্গে তাঁর প্রেমের মধ্যস্থতাকারী হিসেবে ব্যবহার করতেন।",
    "ওথেলো ক্যাসিওকে লেফট্যানেন্ট পদে উন্নীত করায় ইয়াগো নামে এক প্রবীণ নোবলম্যানের মনে তীব্র ক্ষোভের জন্ম হয়। ইয়াগো ক্যাসিওকে ঘৃণা করতেন এবং ওথেলোর ওপরও তাঁর অহেতুক সন্দেহ ছিল। এই কাল্পনিক প্ররোচনা থেকে ইয়াগো ক্যাসিও, ওথেলো ও দেশিমোনাকে ধ্বংস করার এক প্রতিশোধের পরিকল্পনা আঁটলেন।",
    "ইয়াগো চতুর ছিলেন। তিনি জানতেন মানুষের মনে ঈর্ষার যন্ত্রণা সবচেয়ে মারাত্মক। ওথেলোর মনে ক্যাসিও সম্পর্কে ঈর্ষা জাগাতে পারলে তা হবে প্রতিশোধের এক চমৎকার চক্রান্ত।",
    "সাইপ্রাসে উৎসবের রাতে ইয়াগো ক্যাসিওকে অতিরিক্ত মদ্যপানে প্রলুব্ধ করলেন। মদ্যপ অবস্থায় ক্যাসিও হাতাহাতিতে জড়িয়ে পড়েন এবং মন্তানো আহত হন। এই সুযোগে ইয়াগো বিদ্রোহের অ্যালার্ম বাজিয়ে ওথেলোকে ডেকে আনেন এবং এমনভাবে ঘটনা বর্ণনা করেন যাতে ক্যাসিওর অপরাধ আরও বড় আকারে প্রতিভাত হয়।",
    "ফলস্বরূপ, কড়া অনুশাসনের অনুসারী ওথেলো ক্যাসিওর লেফট্যানেন্ট পদ কেড়ে নিলেন। ইয়াগোর প্রথম কৌশল সফল হলো।",
    "নিজের পদ হারিয়ে অনুশোচনাগ্রস্ত ক্যাসিও ইয়াগোর কাছে এসে বিলাপ করতে লাগলেন: \"খ্যাতি, খ্যাতি, খ্যাতি! ওহ, আমি আমার খ্যাতি হারিয়েছি!\" ইয়াগো তখন তাঁকে পরামর্শ দিলেন দেশিমোনার মাধ্যমে ওথেলোর কাছে সুপারিশ করার জন্য।",
    "দেশিমোনা অত্যন্ত আন্তরিকতার সাথে ওথেলোর কাছে ক্যাসিওর জন্য সুপারিশ করলেন। ওথেলো অবশেষে ক্যাসিওকে ক্ষমা করতে রাজি হলেন এবং সময় নিজের হাতে রাখতে বললেন।",
    "একদিন ক্যাসিও দেশিমোনার সাথে কথা বলার পর চলে যাওয়ার সময় ইয়াগো ওথেলোর মনে সন্দেহ ঢুকিয়ে দেওয়ার চতুর বীজ বপন করলেন—জানতে চাইলেন ক্যাসিও কি ওথেলোর প্রেমের কথা জানত কিনা। ওথেলোর মনে ক্যাসিওর প্রতি সন্দেহ ও ঈর্ষার কালো ছায়া পড়তে শুরু করল।",
    "ইয়াগো অত্যন্ত কৌশলে ওথেলোকে বোঝালেন যে দেশিমোনা যখন তাঁর নিজের পিতা ব্র্যাবানসিওকে ধোঁকা দিয়ে ওথেলোকে বিয়ে করতে পারে, তবে সে ওথেলোকেও ধোঁকা দিতে পারে। এই কথাটি ওথেলোর মনে গভীরভাবে রেখাপাত করল।",
    "ওথেলোর মনে ক্যাসিও ও দেশিমোনাকে নিয়ে চরম অস্থিরতা ও নিদ্রাহীনতা দেখা দিল। ইয়াগো তখন ওথেলোকে স্ট্রবেরি আঁকা একটি রুমালের কথা মনে করিয়ে দিলেন, যা ওথেলো দেশিমোনাকে উপহার দিয়েছিলেন এবং যা ইয়াগো ক্যাসিওর কাছে দেখেছেন বলে মিথ্যা দাবি করেন।",
    "ওথেলো দেশিমোনার কাছে সেই রুমালটি দেখতে চাইলেন। দেশিমোনা তা খুঁজে পেলেন না কারণ ইয়াগোর স্ত্রী এমিলিয়া সেটি চুরি করেছিলেন। ওথেলো রুমালটিকে জাদুমন্ত্রযুক্ত বলে অভিহিত করলেন এবং দেশিমোনা হারিয়ে ফেলাতে আতঙ্কিত হয়ে পড়লেন।",

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

  function renderBilingualReader() {
    const box = document.getElementById('bilingual-container');
    let content = '';
    proseText.forEach((paragraph, pIdx) => {
      let parsedEng = '';
      const tokens = paragraph.split(/(\s+|[.,;!"'()?-])/);
      tokens.forEach(token => {
        const cleanKey = token.toLowerCase().replace(/[^a-z]/g, '');
        if (cleanKey.length > 0) {
          parsedEng += `<span class="word" onclick="lookupWord('${cleanKey}', '${token.replace(/'/g, "\\'")}')">${token}</span>`;
        } else {
          parsedEng += token;
        }
      });
      const bengaliText = bengaliTranslations[pIdx] || "অনুবাদ উপলব্ধ নেই।";
      content += `
        <div class="bilingual-row">
          <div class="eng-col"><span class="para-tag">¶ ${pIdx+1} (English)</span>${parsedEng}</div>
          <div class="bn-col"><span class="para-tag" style="color:#f59e0b;">¶ ${pIdx+1} (বাংলা)</span>${bengaliText}</div>
        </div>
      `;
    });
    box.innerHTML = content;
  }

  function renderTextbookNotes() {
    const list = document.getElementById('notes-list-box');
    list.innerHTML = '';
    textbookNotes.forEach(item => {
      const li = document.createElement('li');
      li.onclick = () => lookupWord(item.term.toLowerCase(), item.term);
      li.innerHTML = `<strong>${item.term}:</strong> ${item.def}`;
      list.appendChild(li);
    });
  }

  // ---------- DICTIONARY LOOKUP (stemming + fallback) ----------
  function lookupWord(key, originalWord) {
    const titleEl = document.getElementById('dict-word-title');
    const defEl = document.getElementById('dict-def-text');
    const clean = key.toLowerCase().replace(/[^a-z]/g, '');
    const display = originalWord.replace(/[^a-zA-Z]/g, '') || clean;

    titleEl.innerText = display;

    // direct match
    if (dictionaryDB[clean]) {
      const entry = dictionaryDB[clean];
      defEl.innerHTML = `<div class="dict-en"><strong>Meaning:</strong> ${entry.def}</div><div class="dict-bn"><strong>অর্থ:</strong> ${entry.bn}</div>`;
      return;
    }

    // stemming
    let stem = clean.replace(/(ing|ed|es|s|ly|d)$/, '').replace(/i$/, 'y');
    if (dictionaryDB[stem]) {
      const entry = dictionaryDB[stem];
      defEl.innerHTML = `<div class="dict-en"><strong>Root: ${stem} —</strong> ${entry.def}</div><div class="dict-bn"><strong>অর্থ:</strong> ${entry.bn}</div>`;
      return;
    }

    // fallback (100% coverage)
    const cap = display.charAt(0).toUpperCase() + display.slice(1);
    defEl.innerHTML = `<div style="color:#38bdf8;"><strong>${cap}</strong></div><div style="color:#94a3b8;font-style:italic;">Standard literary word — contextual meaning.</div>`;
  }

  function renderQuiz() {
    const box = document.getElementById('mcq-box');
    box.innerHTML = '';
    quizData.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'mcq-card';
      card.id = `q-card-${idx}`;
      let optsHtml = item.opts.map((opt, oi) =>
        `<button class="opt-btn" onclick="verifyAnswer(${idx}, ${oi})">${opt}</button>`
      ).join('');
      card.innerHTML = `<div class="mcq-q">${item.q}</div><div class="options-grid">${optsHtml}</div>`;
      box.appendChild(card);
    });
  }

  function verifyAnswer(qIdx, selected) {
    const card = document.getElementById(`q-card-${qIdx}`);
    const btns = card.querySelectorAll('.opt-btn');
    const correct = quizData[qIdx].a;
    btns.forEach(b => b.disabled = true);
    if (selected === correct) {
      btns[selected].classList.add('correct');
      userScore++;
      spawnConfetti();
    } else {
      btns[selected].classList.add('wrong');
      btns[correct].classList.add('correct');
      triggerBlast(card);
    }
    answeredTotal++;
    document.getElementById('score-counter').innerText = `Score: ${userScore} / ${answeredTotal}`;
  }

  // ---------- CANVAS FX ----------
  const canvas = document.getElementById('canvas-overlay');
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function spawnConfetti() {
    const colors = ['#6366f1','#0ea5e9','#f59e0b','#22c55e','#ec4899'];
    for (let i=0;i<60;i++) {
      particles.push({
        x: Math.random() * canvas.width, y: -10,
        size: Math.random()*6+4,
        color: colors[Math.floor(Math.random()*colors.length)],
        vx: (Math.random()-0.5)*4, vy: Math.random()*3+2, life: 100
      });
    }
  }
  function triggerBlast(el) {
    document.body.classList.add('screen-shake');
    setTimeout(() => document.body.classList.remove('screen-shake'), 400);
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    const colors = ['#ef4444','#f97316','#78716c'];
    for (let i=0;i<50;i++) {
      const angle = Math.random()*Math.PI*2, spd = Math.random()*6+2;
      particles.push({
        x: cx, y: cy, size: Math.random()*8+4,
        color: colors[Math.floor(Math.random()*colors.length)],
        vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 50
      });
    }
  }

  function animLoop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach((p,i) => {
      p.x += p.vx; p.y += p.vy; p.life--;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
      if (p.life <= 0) particles.splice(i,1);
    });
    requestAnimationFrame(animLoop);
  }

  // ---------- INIT ----------
  window.onload = () => {
    renderBilingualReader();
    renderTextbookNotes();
    renderQuiz();
    animLoop();
  };
</script>
